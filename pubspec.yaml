name: resto_queue
description: Sistem Manajemen Antrian Pintar untuk Restoran dengan Notifikasi Real-Time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2

  # State management & routing
  provider: ^6.1.2
  go_router: ^17.2.3

  # Notifications & QR
  flutter_local_notifications: ^17.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  app_links: ^7.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
