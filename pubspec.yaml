name: resto_queue
description: Sistem Manajemen Antrian Pintar untuk Restoran dengan Notifikasi Real-Time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # State management & routing
  provider: ^6.1.2
  go_router: ^14.6.1

  # Notifications & QR
  flutter_local_notifications: ^17.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  app_links: ^6.3.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
